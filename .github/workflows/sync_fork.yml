name: Fork Sync

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

permissions:
    contents: write

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                fetch-depth: 0

            - name: Sync Upstream
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/huangxd-/danmu_api.git
                  git fetch upstream main
                  git merge upstream/main --no-edit || {
                      echo "[Error] Merge conflict, manual resolution needed"
                      exit 1
                  }
                  # 保留自己的 .github/workflows（GitHub 不让 GITHUB_TOKEN 推 workflow 改动）
                  git checkout HEAD -- .github/workflows/ 2>/dev/null || true
                  if git diff --quiet HEAD upstream/main -- .github/workflows/; then
                      echo "workflow files differ from upstream (intentionally skipped)"
                  fi

            - name: Push changes
              run: |
                  if git diff --quiet origin/main HEAD; then
                      echo "No changes to sync"
                      exit 0
                  fi
                  # 确认待推送提交里没有 workflow 改动，有则从提交链上剔除
                  if git diff --stat origin/main HEAD -- .github/workflows/ | grep -q .; then
                      echo "Removing workflow file changes from sync commit"
                      git reset --soft origin/main
                      git checkout upstream/main -- ':!.github/workflows' 2>/dev/null || true
                      git add -A ':!.github/workflows'
                      git commit -m "Merge branch 'huangxd-:main' into main (workflows skipped)"
                  fi
                  git push origin main

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. Check the logs above."
                  exit 1
